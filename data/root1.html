<!DOCTYPE html>
<html>

<head>
  <title>main screen</title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <meta http-equiv="content-style-type" content="text/css" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" type="text/css" href="/style.css" />
  <style type="text/css">
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    
    .section-title {
      background: linear-gradient(135deg, #034078 0%, #1282a2 100%);
      color: white;
      padding: 20px 15px;
      text-align: center;
    }
    
    .section-title h2 {
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 600;
      margin: 0;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
      font-size: clamp(0.9rem, 3vw, 1.5rem);
    }
    
    .results-table thead {
      background: linear-gradient(135deg, #034078 0%, #0a5aa0 100%);
      color: white;
    }
    
    .results-table th {
      padding: clamp(10px, 3vw, 15px);
      font-weight: 600;
      text-align: center;
      border: none;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .results-table th:first-child {
      width: clamp(40px, 15%, 80px);
      border-right: 1px solid rgba(255,255,255,0.3);
    }
    
    .results-table td {
      padding: clamp(8px, 2.5vw, 12px);
      text-align: center;
      border-bottom: 1px solid #e8e8e8;
      transition: background-color 0.2s ease;
    }
    
    .results-table tbody tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    
    .results-table tbody tr:hover {
      background-color: #e3f2fd;
    }
    
    .results-table tr td:first-child {
      font-weight: 700;
      color: #034078;
      background: #f0f4f8;
      border-right: 2px solid #034078;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    }
    
    .record-link {
      color: #1282a2;
      text-decoration: none;
      font-weight: 600;
      font-size: clamp(0.9rem, 3vw, 1.4rem);
      transition: color 0.2s ease;
    }
    
    .record-link:hover {
      color: #034078;
      text-decoration: underline;
    }
    
    .record-number {
      color: #667eea;
      font-weight: 700;
    }
    
    .info-bar {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      padding: clamp(10px, 3vw, 15px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(10px, 3vw, 20px);
      border-top: 2px solid #034078;
    }
    
    .info-bar span {
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      color: #495057;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: clamp(15px, 4vw, 25px);
      background: #fafbfc;
      border-top: 1px solid #e8e8e8;
    }
    
    @media (max-width: 480px) {
      body {
        padding: 5px;
      }
      
      .container {
        border-radius: 10px;
      }
      
      .section-title {
        padding: 15px 10px;
      }
      
      .results-table th, 
      .results-table td {
        padding: 6px 4px;
      }
      
      .nav-links {
        padding: 10px;
      }
    }
    
    @media (max-width: 360px) {
      .results-table {
        font-size: 0.75rem;
      }
      
      .results-table th:first-child {
        width: 35px;
      }
    }
  </style>
  
</head>

<body>

    function Refresh() {
      window.parent.location = window.parent.location.href;
    }
  </script>

  <div class="container">
  <div class="section-title">
    <h2>🏆 Спортивный таймер - Результаты</h2>
  </div>
  <div class="table-wrapper">
  <table class="results-table">
    <thead>
      <tr>
        <th>№</th>
        <th>Время</th>
      </tr>
    </thead>
    <tbody>
