<!DOCTYPE html>
<html>

<head>
  <title>Full Edit - Sports Timer</title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <meta http-equiv="content-style-type" content="text/css" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" type="text/css" href="/style.css" />
  <style type="text/css">
    .edit-table {
        width: 100%;
        max-width: 900px;
        border-collapse: collapse;
        margin: 20px auto;
        border: 2px solid #034078;
    }
    .edit-table th {
        background: #034078;
        color: white;
        padding: 15px 20px;
        font-weight: 600;
        font-size: 1.1rem;
        border: 1px solid #034078;
    }
    .edit-table td {
        padding: 10px 15px;
        background: #fff;
        border: 1px solid #ddd;
    }
    .edit-table tr td:first-child {
        font-weight: bold;
        color: #666;
        background: #f8f9fa;
        min-width: 50px;
        text-align: center;
    }
    .edit-input {
        width: 70px;
        height: 35px;
        font-size: 1.3rem;
        text-align: center;
        border: 2px solid #1282a2;
        padding: 3px 8px;
        margin-right: 10px;
    }
    .edit-input:focus {
        border-color: #034078;
        outline: none;
    }
    .edit-time {
        font-size: 1.4rem;
        font-weight: 600;
        color: #034078;
    }
    .record-deleted {
        color: #dc3545;
        font-weight: bold;
    }
    .section-header {
        background: #034078;
        color: white;
        padding: 20px 40px;
        margin: 20px auto;
        max-width: 900px;
        border: 2px solid #034078;
        text-align: center;
    }
    .section-header h2 {
        margin: 0;
        font-size: 1.8rem;
    }
    .action-buttons {
        margin: 25px auto;
        max-width: 900px;
        text-align: center;
    }
    .btn-submit, .btn-cancel {
        padding: 15px 40px;
        font-size: 1.1rem;
        margin: 0 10px;
        border: 2px solid;
        cursor: pointer;
    }
    .btn-submit {
        background: #28a745;
        color: white;
        border-color: #28a745;
    }
    .btn-cancel {
        background: #6c757d;
        color: white;
        border-color: #6c757d;
    }
  </style>
</head>

<body>
  <div style="text-align: center">
    <div class="section-header">
      <h2>Полное редактирование результатов</h2>
    </div>
    <form action="/fseditprocess" method="GET" autocomplete="off">
    <table class="edit-table">
      <thead>
        <tr>
          <th>№</th>
          <th>Данные записи</th>
        </tr>
      </thead>
      <tbody>
