<head>

  <meta http-equiv="content-style-type" content="text/css" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="Pragma" content="no-cache" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" type="text/css" href="/style.css" />
  <style type="text/css">
    .results-table {
        width: 100%;
        max-width: 800px;
        border-collapse: collapse;
        margin: 20px auto;
        border: 2px solid #034078;
    }
    .results-table th {
        background: #034078;
        color: white;
        padding: 12px 20px;
        font-weight: 600;
        border: 1px solid #034078;
    }
    .results-table td {
        padding: 12px 20px;
        background: #fff;
        border: 1px solid #ddd;
    }
    .results-table tr td:first-child {
        font-weight: bold;
        color: #666;
        background: #f8f9fa;
        min-width: 60px;
        text-align: center;
    }
    .record-link {
        color: #034078;
        text-decoration: none;
        font-size: 1.4rem;
        font-weight: 500;
        display: block;
    }
    .record-number {
        font-size: 1.1rem;
        color: #1282a2;
        font-weight: bold;
    }
    .section-title {
        background: #034078;
        color: white;
        padding: 15px 30px;
        margin: 20px auto;
        max-width: 800px;
        border: 2px solid #034078;
    }
    .info-bar {
        background: #f8f9fa;
        padding: 15px;
        margin: 15px auto;
        max-width: 800px;
        border: 1px solid #ddd;
    }
    .info-bar a {
        color: #034078;
        text-decoration: none;
        padding: 8px 16px;
        border: 1px solid #ccc;
        margin: 5px;
    }
    .nav-links {
        margin: 20px 0;
    }
    .nav-links a {
        margin: 0 10px;
    }
  </style>

</head>
