<!DOCTYPE html>
<html>

<head>
  <title>Full Edit - Sports Timer</title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <meta http-equiv="content-style-type" content="text/css" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" type="text/css" href="/style.css" />
  <style type="text/css">
    .edit-table {
        width: 100%;
        max-width: 900px;
        border-collapse: separate;
        border-spacing: 0 10px;
        margin: 20px auto;
    }
    .edit-table th {
        background: linear-gradient(135deg, #034078, #1282a2);
        color: white;
        padding: 15px 20px;
        border-radius: 10px 10px 0 0;
        font-weight: 600;
        font-size: 1.1rem;
    }
    .edit-table td {
        padding: 10px 15px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .edit-table tr td:first-child {
        border-radius: 10px 0 0 10px;
        font-weight: bold;
        color: #666;
        background: #f8f9fa;
        min-width: 50px;
        text-align: center;
    }
    .edit-table tr td:last-child {
        border-radius: 0 10px 10px 0;
    }
    .edit-table tbody tr {
        transition: transform 0.2s;
    }
    .edit-table tbody tr:hover {
        transform: scale(1.01);
    }
    .edit-input {
        width: 80px !important;
        height: 40px !important;
        font-size: 1.5rem !important;
        text-align: center;
        border: 2px solid #1282a2;
        border-radius: 8px;
        padding: 5px 10px !important;
        margin: 0 10px 0 0 !important;
        transition: all 0.2s;
    }
    .edit-input:focus {
        border-color: #034078;
        box-shadow: 0 0 10px rgba(3, 64, 120, 0.3);
        outline: none;
    }
    .edit-time {
        font-size: 1.5rem;
        font-weight: 600;
        color: #034078;
    }
    .record-deleted {
        color: #dc3545 !important;
        font-weight: bold;
    }
    .section-header {
        background: linear-gradient(135deg, #034078, #1282a2);
        color: white;
        padding: 20px 40px;
        border-radius: 15px;
        margin: 20px auto;
        max-width: 900px;
        box-shadow: 0 4px 20px rgba(3, 64, 120, 0.3);
        text-align: center;
    }
    .section-header h2 {
        margin: 0;
        font-size: 1.8rem;
    }
    .action-buttons {
        margin: 25px auto;
        max-width: 900px;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }
    .btn-submit {
        background: linear-gradient(135deg, #28a745, #20c997) !important;
        color: white !important;
        padding: 15px 40px !important;
        font-size: 1.1rem !important;
        border-radius: 30px !important;
        width: auto !important;
    }
    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4) !important;
    }
    .btn-cancel {
        background: linear-gradient(135deg, #6c757d, #495057) !important;
        color: white !important;
        padding: 15px 40px !important;
        font-size: 1.1rem !important;
        border-radius: 30px !important;
        width: auto !important;
    }
    .btn-cancel:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(108, 117, 125, 0.4) !important;
    }
  </style>
</head>

<body>
  <div style="text-align: center">
    <div class="section-header">
      <h2>✏️ Полное редактирование результатов</h2>
    </div>
    <form action="/fseditprocess" method="GET" autocomplete="off">
    <table class="edit-table">
      <thead>
        <tr>
          <th>№</th>
          <th>Данные записи</th>
        </tr>
      </thead>
      <tbody>
