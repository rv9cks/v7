; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
; upload_protocol = espota
; upload_port = 192.168.4.1
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200

; Оптимизации компилятора для ESP8266
build_flags = 
    -Os                    ; Оптимизация по размеру
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY  ; Экономия RAM
    -DVTABLES_IN_FLASH     ; Таблицы виртуальных функций во flash
    -ffunction-sections    ; Удаление неиспользуемых функций
    -fdata-sections
    -Wl,--gc-sections
    -DMMU_IRAM_SIZE=0x8000 ; Увеличиваем IRAM
    -DMMU_ICACHE_SIZE=0x8000

[env:d1_mini_lite]
platform = espressif8266
board = d1_mini_lite
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200

; Те же оптимизации для D1 Mini
build_flags = 
    -Os
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DMMU_IRAM_SIZE=0x8000
    -DMMU_ICACHE_SIZE=0x8000
